  <!-- JavaScript: Authentifizierung -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");

      loginTab.addEventListener("click", () => {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
      });

      registerTab.addEventListener("click", () => {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
      });

      document.getElementById("loginButton").addEventListener("click", loginUser);
      document.getElementById("registerButton").addEventListener("click", registerUser);
    });

    // Validiert die E-Mail-Adresse und sperrt bestimmte Domains
    function validateEmail(email) {
      const spamDomains = ["spoofmil.de", "spammail.com"];
      const domain = email.split('@')[1]?.toLowerCase();
      return domain && !spamDomains.includes(domain);
    }

    // Login-Funktion: Überprüft, ob der eingegebene Code in der Liste vorhanden ist,
    // und leitet bei Erfolg zur Zielseite weiter
    async function loginUser() {
      const email = document.getElementById("loginEmail").value.trim();
      const inputCode = document.getElementById("loginKey").value.trim();
      
      if (!validateEmail(email)) {
        alert("Ungültige oder gesperrte E-Mail-Adresse!");
        return;
      }
      if (!inputCode) {
        alert("Bitte geben Sie einen Code ein!");
        return;
      }

      try {
        const response = await fetch("https://thunderv3.github.io/Jaytvplus/list.txt");
        if (!response.ok) throw new Error("Code-Liste konnte nicht geladen werden");
        
        const codes = (await response.text())
          .split('\n')
          .map(code => code.trim())
          .filter(Boolean);

        if (!codes.includes(inputCode)) {
          alert("Ungültiger Code!");
          return;
        }

        // Bei erfolgreichem Login erfolgt die Weiterleitung
        window.location.href = "https://thunderv3.github.io/";
      } catch (error) {
        alert("Fehler beim Überprüfen des Codes");
        console.error(error);
      }
    }

    // Registrierungs-Funktion: Wählt einen zufälligen Code aus der Liste aus und zeigt ihn in einem Popup an
    async function registerUser() {
      const email = document.getElementById("registerEmail").value.trim();
      const name = document.getElementById("registerName").value.trim();

      if (!validateEmail(email)) {
        alert("Ungültige oder gesperrte E-Mail-Adresse!");
        return;
      }
      if (!name) {
        alert("Bitte geben Sie Ihren Namen ein!");
        return;
      }

      try {
        const response = await fetch("https://thunderv3.github.io/Jaytvplus/list.txt");
        if (!response.ok) throw new Error("Code-Liste konnte nicht geladen werden");

        const codes = (await response.text())
          .split('\n')
          .map(code => code.trim())
          .filter(Boolean);
        if (codes.length === 0) {
          alert("Kein Code verfügbar!");
          return;
        }

        const newCode = codes[Math.floor(Math.random() * codes.length)];
        openPopup("Registrierung Erfolgreich", `<p>Email: ${email}</p><p>Name: ${name}</p><p>Code: ${newCode}</p>`);
      } catch (error) {
        alert("Fehler beim Abrufen des Codes");
        console.error(error);
      }
    }

    // Öffnet ein Popup-Fenster, das ein vollständiges HTML-Dokument enthält
    function openPopup(title, content) {
      const popupWidth = 400, popupHeight = 300;
      const left = (screen.width - popupWidth) / 2;
      const top = (screen.height - popupHeight) / 2;
      const features = `width=${popupWidth},height=${popupHeight},left=${left},top=${top},resizable=yes,scrollbars=yes`;

      const popupWindow = window.open("", "popup", features);
      if (!popupWindow) {
        alert("Popup konnte nicht geöffnet werden. Bitte deaktivieren Sie Ihren Popup-Blocker.");
        return;
      }

      popupWindow.document.open();
      popupWindow.document.write(`
        <!DOCTYPE html>
        <html lang="de">
        <head>
          <meta charset="UTF-8">
          <title>${title}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            h1 { font-size: 24px; margin-bottom: 15px; }
            p { font-size: 18px; margin-bottom: 10px; }
          </style>
        </head>
        <body>
          <h1>${title}</h1>
          ${content}
        </body>
        </html>
      `);
      popupWindow.document.close();
    }
  </script>
